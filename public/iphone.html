<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Im Cam — iPhone USB</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 640px;
    }

    .badge {
      display: flex; align-items: center; gap: 6px;
      background: #1a1a1a; border: 1px solid #333;
      border-radius: 20px; padding: 4px 12px;
      font-size: 12px; font-weight: 700; letter-spacing: 1px;
      color: #666; transition: all .3s;
    }
    .badge.live { background: rgba(220,38,38,.15); border-color: #dc2626; color: #ef4444; }
    .badge .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #666; transition: background .3s;
    }
    .badge.live .dot {
      background: #ef4444; box-shadow: 0 0 6px #ef4444;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .status { font-size: 13px; color: #666; flex: 1; }
    .status.ok  { color: #4ade80; }
    .status.err { color: #f87171; }

    .method { font-size: 11px; color: #444; font-family: monospace; }

    /* Viewer */
    .viewer {
      width: 100%; max-width: 640px;
      background: #111; border-radius: 8px;
      overflow: hidden; position: relative;
    }

    #mjpeg {
      width: 100%; display: block;
      min-height: 200px; background: #111;
    }

    .placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; color: #555; font-size: 14px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #222; border-top-color: #3b82f6;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to{transform:rotate(360deg)} }
    .placeholder.hidden { display: none; }

    /* Instructions */
    .info {
      width: 100%; max-width: 640px;
      background: #111; border: 1px solid #222;
      border-radius: 8px; padding: 14px 16px;
      font-size: 12px; color: #555; line-height: 1.7;
    }
    .info code {
      background: #1a1a1a; padding: 1px 6px;
      border-radius: 4px; color: #888;
      font-family: monospace;
    }
    .info strong { color: #888; }
  </style>
</head>
<body>

  <div class="header">
    <div class="badge" id="badge"><span class="dot"></span>LIVE</div>
    <span class="status" id="status">Connexion iPhone...</span>
    <span class="method" id="method"></span>
  </div>

  <div class="viewer">
    <img id="mjpeg" alt="Flux iPhone">
    <div class="placeholder" id="placeholder">
      <div class="spinner"></div>
      <span>En attente de l'iPhone...</span>
    </div>
  </div>

  <div class="info">
    <strong>Prérequis :</strong>
    iPhone branché en USB + "Faire confiance" accepté sur l'iPhone<br>
    <strong>Outil requis :</strong>
    <code>brew install libimobiledevice</code>
    &nbsp;ou&nbsp;
    <code>pip3 install pymobiledevice3</code><br>
    <strong>Lancer :</strong>
    <code>node iphone-stream.js</code>
  </div>

  <script>
    const badge    = document.getElementById('badge');
    const status   = document.getElementById('status');
    const methodEl = document.getElementById('method');
    const img      = document.getElementById('mjpeg');
    const ph       = document.getElementById('placeholder');

    let streaming = false;

    function startStream() {
      if (streaming) return;
      streaming = true;
      img.src = '/stream?' + Date.now();
      img.onload = () => ph.classList.add('hidden');
      img.onerror = () => {
        streaming = false;
        ph.classList.remove('hidden');
        setTimeout(startStream, 3000);
      };
    }

    async function poll() {
      try {
        const r = await fetch('/api/status');
        const d = await r.json();

        if (d.connected && d.hasFrame) {
          badge.classList.add('live');
          status.className = 'status ok';
          status.textContent = 'iPhone connecté';
          methodEl.textContent = d.method || '';
          startStream();
        } else if (!d.connected) {
          badge.classList.remove('live');
          status.className = 'status err';
          status.textContent = 'iPhone déconnecté ou en veille';
        } else {
          status.textContent = 'Initialisation...';
        }
      } catch { /* serveur pas encore prêt */ }
    }

    setInterval(poll, 2000);
    poll();
  </script>
</body>
</html>
