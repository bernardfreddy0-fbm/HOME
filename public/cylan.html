<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Im Cam — Live</title>
  <style>
    :root {
      --bg:    #0a0a0a;
      --panel: #141414;
      --card:  #1c1c1c;
      --border:#2a2a2a;
      --text:  #e0e0e0;
      --muted: #555;
      --green: #4ade80;
      --red:   #ef4444;
      --blue:  #3b82f6;
      --amber: #f59e0b;
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; touch-action:manipulation; }
    html, body { height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,sans-serif; overflow:hidden; }

    /* ── Layout ── */
    #app { display:flex; flex-direction:column; height:100vh; }

    /* ── Topbar ── */
    #topbar {
      display:flex; align-items:center; gap:10px;
      padding:8px 14px; background:var(--panel);
      border-bottom:1px solid var(--border); flex-shrink:0;
    }
    .badge {
      display:flex; align-items:center; gap:5px;
      border-radius:20px; padding:3px 10px;
      font-size:11px; font-weight:700; letter-spacing:.8px;
      background:var(--card); border:1px solid var(--border); color:var(--muted);
      transition:.3s;
    }
    .badge.live       { background:rgba(239,68,68,.12); border-color:var(--red); color:var(--red); }
    .badge.connecting { background:rgba(59,130,246,.12); border-color:var(--blue); color:var(--blue); }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--muted); }
    .badge.live .dot       { background:var(--red); box-shadow:0 0 5px var(--red); animation:pulse 1.5s infinite; }
    .badge.connecting .dot { background:var(--blue); animation:pulse .9s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    #statusMsg { font-size:12px; color:var(--muted); flex:1; }
    #statusMsg.ok  { color:var(--green); }
    #statusMsg.err { color:var(--red); }

    .top-btn {
      background:none; border:1px solid var(--border); color:var(--muted);
      border-radius:6px; padding:4px 10px; font-size:12px; cursor:pointer;
      transition:.2s;
    }
    .top-btn:hover { border-color:var(--blue); color:var(--blue); }
    .top-btn.active { border-color:var(--red); color:var(--red); background:rgba(239,68,68,.1); }

    /* ── Main area ── */
    #main { display:flex; flex:1; overflow:hidden; }

    /* ── Video ── */
    #videoWrap {
      flex:1; position:relative; background:#000;
      display:flex; align-items:center; justify-content:center;
    }
    #videoEl { width:100%; height:100%; object-fit:contain; display:block; }

    /* overlay spinner / connect */
    #overlay {
      position:absolute; inset:0;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
      background:rgba(0,0,0,.88);
    }
    #overlay.hidden { display:none; }
    .spinner { width:38px; height:38px; border:3px solid #222; border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to{ transform:rotate(360deg) } }
    .overlay-label { font-size:13px; color:var(--muted); text-align:center; max-width:260px; line-height:1.5; }
    .overlay-label.err { color:var(--red); }
    .btn-connect {
      background:var(--blue); color:#fff; border:none; border-radius:8px;
      padding:11px 28px; font-size:14px; font-weight:600; cursor:pointer; transition:.2s;
    }
    .btn-connect:hover { background:#2563eb; }

    /* PTZ overlay on video (bottom-left) */
    #ptzPad {
      position:absolute; bottom:16px; left:16px;
      display:grid; grid-template-columns:repeat(3,44px); grid-template-rows:repeat(3,44px); gap:4px;
      opacity:.85;
    }
    #ptzPad.hidden { display:none; }
    .ptz-btn {
      background:rgba(0,0,0,.65); border:1px solid rgba(255,255,255,.18);
      border-radius:8px; color:#fff; font-size:18px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      user-select:none; transition:.15s;
    }
    .ptz-btn:active { background:rgba(59,130,246,.5); border-color:var(--blue); transform:scale(.9); }
    .ptz-center { font-size:12px; color:var(--muted); }

    /* Zoom buttons (right side of video) */
    #zoomBtns {
      position:absolute; bottom:16px; right:16px;
      display:flex; flex-direction:column; gap:6px;
    }
    #zoomBtns.hidden { display:none; }
    .zoom-btn {
      background:rgba(0,0,0,.65); border:1px solid rgba(255,255,255,.18);
      border-radius:8px; width:44px; height:44px; color:#fff; font-size:20px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; user-select:none; transition:.15s;
    }
    .zoom-btn:active { background:rgba(59,130,246,.5); transform:scale(.9); }

    /* ── Sidebar controls ── */
    #sidebar {
      width:72px; background:var(--panel); border-left:1px solid var(--border);
      display:flex; flex-direction:column; align-items:center;
      padding:12px 0; gap:6px; flex-shrink:0;
    }
    .ctrl-btn {
      width:52px; height:52px;
      background:var(--card); border:1px solid var(--border);
      border-radius:10px; color:var(--muted);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
      cursor:pointer; transition:.2s; user-select:none;
    }
    .ctrl-btn span.icon { font-size:20px; line-height:1; }
    .ctrl-btn span.label { font-size:9px; letter-spacing:.3px; }
    .ctrl-btn:hover  { border-color:var(--blue); color:var(--blue); }
    .ctrl-btn.active { border-color:var(--red); color:var(--red); background:rgba(239,68,68,.08); }
    .ctrl-btn.on     { border-color:var(--green); color:var(--green); background:rgba(74,222,128,.08); }
    .ctrl-btn.disabled { opacity:.3; pointer-events:none; }

    .separator { width:40px; height:1px; background:var(--border); margin:4px 0; }

    /* ── Recording timer ── */
    #recTimer {
      position:absolute; top:12px; right:12px;
      background:rgba(239,68,68,.85); color:#fff;
      border-radius:6px; padding:3px 8px; font-size:12px; font-weight:700;
      display:none;
    }

    /* ── HD/SD badge on video ── */
    #qualBadge {
      position:absolute; top:12px; left:12px;
      background:rgba(0,0,0,.65); border:1px solid rgba(255,255,255,.2);
      color:#fff; border-radius:5px; padding:2px 7px; font-size:11px; font-weight:700;
    }
    #qualBadge.hidden { display:none; }

    /* ── Tabs ── */
    .tab-btn {
      background:none; border:none; color:var(--muted);
      padding:5px 14px; font-size:12px; font-weight:600; cursor:pointer;
      border-bottom:2px solid transparent; letter-spacing:.5px; transition:.2s;
    }
    .tab-btn:hover { color:var(--text); }
    .tab-btn.active { color:var(--blue); border-bottom-color:var(--blue); }

    /* ── Freebox panel ── */
    #freeboxPanel {
      display:none; flex:1; overflow:hidden;
    }
    #freeboxPanel.visible { display:flex; }
    #freeboxFrame {
      flex:1; border:none; width:100%; height:100%;
      background:#fff;
    }

    /* ── Note bar ── */
    #notebar {
      background:var(--panel); border-top:1px solid var(--border);
      padding:6px 14px; font-size:11px; color:#333;
      display:flex; align-items:center; gap:12px; flex-shrink:0;
    }
    #notebar a { color:#374151; text-decoration:none; }
    #notebar code { background:var(--card); padding:1px 5px; border-radius:3px; color:#4b5563; font-family:monospace; }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Topbar ── -->
  <div id="topbar">
    <div class="badge" id="badge"><span class="dot"></span><span id="badgeText">OFFLINE</span></div>
    <button class="tab-btn active" id="tabCam">📷 CAMÉRA</button>
    <button class="tab-btn" id="tabFreebox">📺 FREEBOX</button>
    <span class="status" id="statusMsg">Appuyer sur Connecter</span>
    <button class="top-btn" id="btnFullscreen" title="Plein écran">⛶</button>
  </div>

  <!-- ── Main ── -->
  <div id="main">

    <!-- Vidéo -->
    <div id="videoWrap">
      <video id="videoEl" autoplay playsinline muted></video>

      <!-- Overlay -->
      <div id="overlay">
        <button class="btn-connect" id="connectBtn">▶&nbsp; Connecter</button>
        <span class="overlay-label" id="overlayLabel">Connexion directe — app Im Cam non requise</span>
      </div>

      <!-- Badge qualité -->
      <div id="qualBadge" class="hidden">SD</div>

      <!-- Timer enregistrement -->
      <div id="recTimer">⏺ 00:00</div>

      <!-- PTZ pad -->
      <div id="ptzPad" class="hidden">
        <div></div>
        <div class="ptz-btn" id="ptz-up"    title="Haut">↑</div>
        <div></div>
        <div class="ptz-btn" id="ptz-left"  title="Gauche">←</div>
        <div class="ptz-btn ptz-center"     title="Stop">●</div>
        <div class="ptz-btn" id="ptz-right" title="Droite">→</div>
        <div></div>
        <div class="ptz-btn" id="ptz-down"  title="Bas">↓</div>
        <div></div>
      </div>

      <!-- Zoom -->
      <div id="zoomBtns" class="hidden">
        <div class="zoom-btn" id="zoom-in"  title="Zoom +">+</div>
        <div class="zoom-btn" id="zoom-out" title="Zoom −">−</div>
      </div>
    </div>

    <!-- ── Sidebar ── -->
    <div id="sidebar">

      <!-- Vidéo -->
      <div class="ctrl-btn on"  id="btnVideo" title="Vidéo">
        <span class="icon">🎥</span>
        <span class="label">VIDÉO</span>
      </div>

      <!-- Audio -->
      <div class="ctrl-btn on" id="btnAudio" title="Micro/Audio">
        <span class="icon">🔊</span>
        <span class="label">AUDIO</span>
      </div>

      <div class="separator"></div>

      <!-- PTZ -->
      <div class="ctrl-btn disabled" id="btnPtz" title="Contrôles PTZ">
        <span class="icon">🕹️</span>
        <span class="label">PTZ</span>
      </div>

      <div class="separator"></div>

      <!-- Qualité SD/HD -->
      <div class="ctrl-btn disabled" id="btnQuality" title="Basculer SD ↔ HD">
        <span class="icon">📺</span>
        <span class="label">HD</span>
      </div>

      <!-- Snapshot -->
      <div class="ctrl-btn disabled" id="btnSnap" title="Capture d'écran">
        <span class="icon">📷</span>
        <span class="label">SNAP</span>
      </div>

      <!-- Enregistrement -->
      <div class="ctrl-btn disabled" id="btnRec" title="Enregistrer">
        <span class="icon">⏺</span>
        <span class="label">REC</span>
      </div>

    </div>
  </div>

  <!-- ── Freebox panel ── -->
  <div id="freeboxPanel">
    <iframe id="freeboxFrame" src="" allow="autoplay; fullscreen" title="Freebox Remote"></iframe>
  </div>

  <!-- ── Note ── -->
  <div id="notebar">
    <span>Lancer : <code>node cylan-webrtc-server.js</code></span>
    <span>·</span>
    <a href="/api/status" id="apiLink">statut API</a>
  </div>

</div>

<script>
'use strict';

// ── Refs ──────────────────────────────────────────────────────────────────────
const badge      = document.getElementById('badge');
const badgeText  = document.getElementById('badgeText');
const statusMsg  = document.getElementById('statusMsg');
const videoEl    = document.getElementById('videoEl');
const overlay    = document.getElementById('overlay');
const overlayLbl = document.getElementById('overlayLabel');
const connectBtn = document.getElementById('connectBtn');
const ptzPad     = document.getElementById('ptzPad');
const zoomBtns   = document.getElementById('zoomBtns');
const qualBadge  = document.getElementById('qualBadge');
const recTimer   = document.getElementById('recTimer');

const btnVideo   = document.getElementById('btnVideo');
const btnAudio   = document.getElementById('btnAudio');
const btnPtz     = document.getElementById('btnPtz');
const btnQuality = document.getElementById('btnQuality');
const btnSnap    = document.getElementById('btnSnap');
const btnRec     = document.getElementById('btnRec');
const btnFS      = document.getElementById('btnFullscreen');

const spinner    = (() => { const d=document.createElement('div'); d.className='spinner'; return d; })();

// ── State ─────────────────────────────────────────────────────────────────────
let ws        = null;
let pc        = null;
let state     = 'idle';      // idle | connecting | connected | error
let hdMode    = true;        // true=HD, false=SD
let videoMuted= false;
let audioMuted= false;
let ptzVisible= false;
let recorder  = null;
let recChunks = [];
let recStart  = 0;
let recTick   = null;
let connected = false;

// Clé API optionnelle (renseignée dans l'URL ?key=xxx)
const API_KEY = new URLSearchParams(location.search).get('key') || '';

// ── UI helpers ─────────────────────────────────────────────────────────────
function setStatus(s, msg) {
  state = s;
  statusMsg.textContent = msg;
  statusMsg.className = 'status ' + (s==='connected'?'ok': s==='error'?'err': '');
  badge.className     = 'badge '  + (s==='connected'?'live': s==='connecting'?'connecting': '');
  badgeText.textContent = s==='connected'?'LIVE': s==='connecting'?'…': 'OFFLINE';
}

function showSpinner(label) {
  if (!overlay.contains(spinner)) overlay.prepend(spinner);
  connectBtn.style.display = 'none';
  overlayLbl.textContent   = label;
  overlayLbl.className     = 'overlay-label';
  overlay.classList.remove('hidden');
}

function showConnectBtn(label, isErr) {
  if (overlay.contains(spinner)) overlay.removeChild(spinner);
  connectBtn.style.display = '';
  connectBtn.disabled      = false;
  connectBtn.textContent   = '▶  Connecter';
  overlayLbl.textContent   = label;
  overlayLbl.className     = 'overlay-label' + (isErr ? ' err' : '');
  overlay.classList.remove('hidden');
}

function hideOverlay() { overlay.classList.add('hidden'); }

function enableControls(on) {
  [btnPtz, btnQuality, btnSnap, btnRec].forEach(b => {
    b.classList.toggle('disabled', !on);
  });
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

// ── Connexion ─────────────────────────────────────────────────────────────────
connectBtn.addEventListener('click', startConnection);

function startConnection() {
  if (state === 'connecting') return;
  connectBtn.disabled = true;
  setStatus('connecting', 'Connexion…');
  showSpinner('Authentification Cylan…');

  const wsUrl = (location.protocol === 'https:' ? 'wss:' : 'ws:')
    + '//' + location.host + '/ws' + (API_KEY ? '?key=' + encodeURIComponent(API_KEY) : '');

  ws = new WebSocket(wsUrl);
  ws.onopen    = () => { setStatus('connecting', 'Login Cylan…'); ws.send(JSON.stringify({ type: 'connect' })); };
  ws.onmessage = (e) => { try { handleMsg(JSON.parse(e.data)); } catch {} };
  ws.onerror   = ()  => { setStatus('error', 'Serveur local inaccessible'); showConnectBtn('Lancer : node cylan-webrtc-server.js', true); };
  ws.onclose   = ()  => { if (state !== 'idle') { setStatus('error', 'Connexion perdue'); showConnectBtn('Connexion perdue', true); connected=false; enableControls(false); } };
}

// ── Gestion messages serveur ──────────────────────────────────────────────────
async function handleMsg(msg) {
  switch (msg.type) {
    case 'ready':
      setStatus('connecting', 'Négociation WebRTC…');
      showSpinner('Négociation WebRTC…');
      await createPc(msg.iceServers);
      break;

    case 'answer':
      if (pc) await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp }).catch(console.warn);
      break;

    case 'candidate':
      if (pc && msg.candidate) {
        await pc.addIceCandidate({ candidate: msg.candidate, sdpMid: msg.sdpMid, sdpMLineIndex: msg.sdpMLineIndex }).catch(console.warn);
      }
      break;

    case 'switchVideo':
      // La caméra confirme que la vidéo est active
      break;

    case 'hangup':
      setStatus('idle', 'Appel terminé');
      showConnectBtn('La caméra a raccroché', false);
      cleanupPc(); connected=false; enableControls(false);
      break;

    case 'error':
      setStatus('error', msg.message);
      showConnectBtn(msg.message, true);
      cleanupPc(); connected=false; enableControls(false);
      break;
  }
}

// ── WebRTC ────────────────────────────────────────────────────────────────────
async function createPc(iceServers) {
  cleanupPc();
  pc = new RTCPeerConnection({ iceServers });

  pc.ontrack = (e) => {
    if (e.track.kind === 'video') {
      videoEl.srcObject = e.streams[0];
      hideOverlay();
      setStatus('connected', 'Flux en direct');
      connected = true;
      enableControls(true);
      updateQualBadge();
    }
  };

  pc.onicecandidate = (e) => {
    if (e.candidate) send({ type:'candidate', candidate:e.candidate.candidate, sdpMid:e.candidate.sdpMid, sdpMLineIndex:e.candidate.sdpMLineIndex });
  };

  pc.oniceconnectionstatechange = () => {
    const s = pc.iceConnectionState;
    if (s === 'connected' || s === 'completed') { hideOverlay(); setStatus('connected','Flux en direct'); }
    else if (s === 'failed')       { setStatus('error','ICE échoué'); showConnectBtn('Connexion ICE échouée', true); }
    else if (s === 'disconnected') setStatus('connecting','Reconnexion…');
  };

  pc.addTransceiver('video', { direction: 'recvonly' });
  pc.addTransceiver('audio', { direction: 'recvonly' });

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  send({ type: 'offer', sdp: offer.sdp, callType: 0 });
}

function cleanupPc() {
  if (pc) { pc.close(); pc = null; }
  videoEl.srcObject = null;
  stopRecording();
}

// ── PTZ ───────────────────────────────────────────────────────────────────────
function ptzAction(action) {
  if (!connected) return;
  send({ type: 'ptz', action, speed: 2 });
}

// Appui maintenu → mouvement, relâchement → stop
function bindPtz(id, action) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('mousedown',  () => ptzAction(action));
  el.addEventListener('touchstart', (e) => { e.preventDefault(); ptzAction(action); }, { passive: false });
  el.addEventListener('mouseup',    () => ptzAction('stop'));
  el.addEventListener('touchend',   () => ptzAction('stop'));
  el.addEventListener('mouseleave', () => ptzAction('stop'));
}
bindPtz('ptz-up',    'up');
bindPtz('ptz-down',  'down');
bindPtz('ptz-left',  'left');
bindPtz('ptz-right', 'right');
bindPtz('zoom-in',   'zoomin');
bindPtz('zoom-out',  'zoomout');

btnPtz.addEventListener('click', () => {
  if (!connected) return;
  ptzVisible = !ptzVisible;
  ptzPad.classList.toggle('hidden',  !ptzVisible);
  zoomBtns.classList.toggle('hidden', !ptzVisible);
  btnPtz.classList.toggle('active', ptzVisible);
});

// ── Qualité SD/HD ─────────────────────────────────────────────────────────────
btnQuality.addEventListener('click', () => {
  if (!connected) return;
  hdMode = !hdMode;
  send({ type: 'quality', definition: hdMode ? 1 : 0 });
  updateQualBadge();
});

function updateQualBadge() {
  qualBadge.textContent = hdMode ? 'HD' : 'SD';
  qualBadge.classList.remove('hidden');
  const ql = document.querySelector('#btnQuality .label');
  if (ql) ql.textContent = hdMode ? 'HD' : 'SD';
}

// ── Vidéo locale mute ─────────────────────────────────────────────────────────
btnVideo.addEventListener('click', () => {
  videoMuted = !videoMuted;
  videoEl.style.filter = videoMuted ? 'brightness(0)' : '';
  btnVideo.classList.toggle('active', videoMuted);
  btnVideo.classList.toggle('on', !videoMuted);
  const lbl = document.querySelector('#btnVideo .label');
  if (lbl) lbl.textContent = videoMuted ? 'OFF' : 'VIDÉO';
});

// ── Audio mute ────────────────────────────────────────────────────────────────
btnAudio.addEventListener('click', () => {
  audioMuted = !audioMuted;
  videoEl.muted = audioMuted;
  btnAudio.classList.toggle('active', audioMuted);
  btnAudio.classList.toggle('on', !audioMuted);
  const icon = document.querySelector('#btnAudio .icon');
  const lbl  = document.querySelector('#btnAudio .label');
  if (icon) icon.textContent = audioMuted ? '🔇' : '🔊';
  if (lbl)  lbl.textContent  = audioMuted ? 'MUET' : 'AUDIO';
});

// ── Snapshot (capture du frame vidéo) ─────────────────────────────────────────
btnSnap.addEventListener('click', () => {
  if (!connected) return;
  // Capture côté navigateur via Canvas
  const canvas = document.createElement('canvas');
  canvas.width  = videoEl.videoWidth  || 640;
  canvas.height = videoEl.videoHeight || 360;
  canvas.getContext('2d').drawImage(videoEl, 0, 0);
  const ts = new Date().toISOString().replace(/[:.]/g, '-');
  const a  = document.createElement('a');
  a.href     = canvas.toDataURL('image/jpeg', 0.92);
  a.download = 'imcam-' + ts + '.jpg';
  a.click();
  // Flash visuel
  const fl = document.createElement('div');
  Object.assign(fl.style, { position:'fixed', inset:'0', background:'#fff', opacity:'.6', pointerEvents:'none', zIndex:'9999', transition:'opacity .3s' });
  document.body.appendChild(fl);
  requestAnimationFrame(() => { fl.style.opacity='0'; setTimeout(() => fl.remove(), 400); });
});

// ── Enregistrement vidéo ──────────────────────────────────────────────────────
btnRec.addEventListener('click', () => {
  if (!connected) return;
  if (recorder && recorder.state === 'recording') stopRecording();
  else startRecording();
});

function startRecording() {
  const stream = videoEl.srcObject;
  if (!stream) return;
  recChunks = [];
  try {
    recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8,opus' });
  } catch {
    try { recorder = new MediaRecorder(stream); } catch (e) { console.error('MediaRecorder non supporté', e); return; }
  }
  recorder.ondataavailable = (e) => { if (e.data.size > 0) recChunks.push(e.data); };
  recorder.onstop = saveRecording;
  recorder.start(1000);
  recStart = Date.now();
  recTimer.style.display = 'block';
  recTick = setInterval(updateRecTimer, 1000);
  btnRec.classList.add('active');
  const rl = document.querySelector('#btnRec .label');
  if (rl) rl.textContent = 'STOP';
}

function stopRecording() {
  if (recorder && recorder.state === 'recording') recorder.stop();
  recorder = null;
  if (recTick) { clearInterval(recTick); recTick = null; }
  recTimer.style.display = 'none';
  btnRec.classList.remove('active');
  const rl = document.querySelector('#btnRec .label');
  if (rl) rl.textContent = 'REC';
}

function saveRecording() {
  if (!recChunks.length) return;
  const blob = new Blob(recChunks, { type: 'video/webm' });
  const ts   = new Date().toISOString().replace(/[:.]/g, '-');
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = 'imcam-' + ts + '.webm';
  a.click();
  recChunks  = [];
}

function updateRecTimer() {
  const s   = Math.floor((Date.now() - recStart) / 1000);
  const mm  = String(Math.floor(s / 60)).padStart(2, '0');
  const ss  = String(s % 60).padStart(2, '0');
  recTimer.textContent = '⏺ ' + mm + ':' + ss;
}

// ── Plein écran ───────────────────────────────────────────────────────────────
btnFS.addEventListener('click', toggleFullscreen);
videoEl.addEventListener('dblclick', toggleFullscreen);

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.getElementById('videoWrap').requestFullscreen().catch(console.warn);
  } else {
    document.exitFullscreen();
  }
}

document.addEventListener('fullscreenchange', () => {
  btnFS.textContent = document.fullscreenElement ? '✕' : '⛶';
});

// ── Tabs caméra / Freebox ─────────────────────────────────────────────────────
const tabCam      = document.getElementById('tabCam');
const tabFreebox  = document.getElementById('tabFreebox');
const mainPanel   = document.getElementById('main');
const freeboxPanel= document.getElementById('freeboxPanel');
const freeboxFrame= document.getElementById('freeboxFrame');
let freeboxLoaded = false;

tabCam.addEventListener('click', () => {
  tabCam.classList.add('active');
  tabFreebox.classList.remove('active');
  mainPanel.style.display   = 'flex';
  freeboxPanel.classList.remove('visible');
});

tabFreebox.addEventListener('click', () => {
  tabFreebox.classList.add('active');
  tabCam.classList.remove('active');
  mainPanel.style.display   = 'none';
  freeboxPanel.classList.add('visible');
  // Charger l'iframe seulement au premier clic (lazy load)
  if (!freeboxLoaded) {
    freeboxFrame.src = '/freebox/';
    freeboxLoaded = true;
  }
});
</script>
</body>
</html>
