<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Im Cam — Live</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d; color: #e0e0e0;
      font-family: -apple-system, sans-serif;
      min-height: 100vh; display: flex;
      flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; padding: 16px;
    }
    .header { display:flex; align-items:center; gap:10px; width:100%; max-width:700px; }
    .badge {
      display:flex; align-items:center; gap:6px;
      background:#1a1a1a; border:1px solid #333;
      border-radius:20px; padding:4px 12px;
      font-size:12px; font-weight:700; letter-spacing:1px; color:#666;
    }
    .badge.live { background:rgba(220,38,38,.15); border-color:#dc2626; color:#ef4444; }
    .badge .dot { width:8px;height:8px;border-radius:50%;background:#666; }
    .badge.live .dot { background:#ef4444;box-shadow:0 0 6px #ef4444;animation:pulse 1.5s infinite; }
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .status { font-size:13px;color:#666;flex:1; }
    .status.ok { color:#4ade80; }

    .viewer {
      width:100%; max-width:700px;
      background:#111; border-radius:8px; overflow:hidden;
      position:relative; aspect-ratio:16/9;
    }
    #feed { width:100%;height:100%;object-fit:contain;display:block; }
    .overlay {
      position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:12px;
      background:rgba(0,0,0,.75);font-size:14px;color:#555;
    }
    .spinner{width:36px;height:36px;border:3px solid #222;border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .overlay.hidden{display:none;}

    .note {
      width:100%;max-width:700px;font-size:12px;color:#444;
      background:#111;border:1px solid #1e1e1e;border-radius:6px;
      padding:10px 14px;line-height:1.6;
    }
    .note code{background:#1a1a1a;padding:1px 5px;border-radius:3px;color:#777;font-family:monospace;}
  </style>
</head>
<body>
  <div class="header">
    <div class="badge" id="badge"><span class="dot"></span>LIVE</div>
    <span class="status" id="status">Connexion...</span>
  </div>

  <div class="viewer">
    <img id="feed" alt="Flux Im Cam">
    <div class="overlay" id="overlay">
      <div class="spinner"></div>
      <span>En attente du flux Im Cam...</span>
    </div>
  </div>

  <div class="note">
    <strong style="color:#666">Prérequis :</strong>
    L'app <code>Im Cam</code> doit rester ouverte et visible sur le Mac.<br>
    <strong style="color:#666">Lancer :</strong>
    <code>cd ~/im-cam && node screen-stream.js</code>
  </div>

  <script>
    const badge   = document.getElementById('badge');
    const status  = document.getElementById('status');
    const feed    = document.getElementById('feed');
    const overlay = document.getElementById('overlay');

    let running = false;
    let frameCount = 0;
    let lastFpsTime = Date.now();

    // ── Polling JPEG (plus compatible que MJPEG natif) ──────────────────
    async function fetchFrame() {
      try {
        const url = '/frame.jpg?t=' + Date.now();
        const resp = await fetch(url);
        if (!resp.ok) return;
        const blob = await resp.blob();
        const objUrl = URL.createObjectURL(blob);
        const old = feed.src;
        feed.src = objUrl;
        if (old && old.startsWith('blob:')) URL.revokeObjectURL(old);
        overlay.classList.add('hidden');
        frameCount++;
      } catch { /* ignorer */ }
    }

    function startPolling() {
      if (running) return;
      running = true;
      const loop = async () => {
        if (!running) return;
        await fetchFrame();
        setTimeout(loop, 250); // 4 FPS
      };
      loop();
    }

    // ── FPS affiché ─────────────────────────────────────────────────────
    setInterval(() => {
      const now = Date.now();
      const fps = Math.round(frameCount / ((now - lastFpsTime) / 1000));
      frameCount = 0;
      lastFpsTime = now;
      if (running) status.textContent = `En direct — ${fps} FPS`;
    }, 1000);

    // ── Statut serveur ───────────────────────────────────────────────────
    async function pollStatus() {
      try {
        const d = await fetch('/api/status').then(r => r.json());
        if (d.ready) {
          badge.classList.add('live');
          status.className = 'status ok';
          startPolling();
        } else {
          badge.classList.remove('live');
          status.className = 'status';
          status.textContent = 'Attente Im Cam...';
          running = false;
        }
      } catch {
        badge.classList.remove('live');
        status.className = 'status';
        status.textContent = 'Serveur hors ligne...';
      }
    }

    setInterval(pollStatus, 3000);
    pollStatus();
  </script>
</body>
</html>
